<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>The four parts of Bug Driver</title>
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="380"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="379" rx="16" fill="#0b0d13" stroke="#00f0ff" stroke-opacity="0.25"/>
<rect x="30" y="40" width="190" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.7"/><text x="125" y="64" font-size="15" fill="#00f0ff" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">WORLD</text><text x="125" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">the track and its walls</text><text x="125" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">car physics</text><text x="125" y="120" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">checkpoints, lap timer</text>
<rect x="250" y="40" width="190" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.7"/><text x="345" y="64" font-size="15" fill="#00f0ff" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">EYES</text><text x="345" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">5 rays look for walls</text><text x="345" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">→ 6 numbers</text>
<rect x="470" y="40" width="190" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#ffd23f" stroke-width="1" stroke-opacity="0.7"/><text x="565" y="64" font-size="15" fill="#ffd23f" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">BRAIN</text><text x="565" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">70 numbers</text><text x="565" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">6 → 6 → 4 neurons</text>
<rect x="690" y="40" width="180" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#ff2e63" stroke-width="1" stroke-opacity="0.7"/><text x="780" y="64" font-size="15" fill="#ff2e63" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">KEYS</text><text x="780" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">gas · brake</text><text x="780" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">left · right</text><text x="780" y="120" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">(the same 4 as mine)</text>
<line x1="220" y1="100" x2="248" y2="100" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<line x1="440" y1="100" x2="468" y2="100" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<line x1="660" y1="100" x2="688" y2="100" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<path d="M780,160L780,190L125,190L125,162" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" fill="none" fill-opacity="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="340" y="184" font-size="11" fill="#9fb3c8" fill-opacity="1" text-anchor="middle" font-weight="normal">the keys move the car · 60 times a second</text>
<rect x="170" y="225" width="560" height="105" rx="10" fill="#141826" fill-opacity="1" stroke="#39ff88" stroke-width="1" stroke-opacity="0.7"/><text x="450" y="249" font-size="15" fill="#39ff88" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">EVOLUTION</text><text x="450" y="271" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">100 cars try · the best 10 are kept</text><text x="450" y="288" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">their numbers are copied with small random changes</text><text x="450" y="305" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">→ the next 100 cars</text>
<path d="M565,225L565,162" stroke="#39ff88" stroke-width="2" stroke-opacity="1" fill="none" fill-opacity="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="575" y="205" font-size="11" fill="#39ff88" fill-opacity="1" text-anchor="start" font-weight="normal">better numbers</text>
<text x="450" y="360" font-size="13" fill="#e6ebf2" fill-opacity="0.8" text-anchor="middle" font-weight="normal">No AI knowledge needed: each part is a few short, plain functions.</text>
</svg>
