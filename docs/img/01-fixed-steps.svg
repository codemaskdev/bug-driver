<text x="430" y="280" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="middle" font-weight="normal">Screens draw as often as they can. The simulation always moves in steps of exactly 1/60 s,</text>
<text x="430" y="298" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="middle" font-weight="normal">so the same keys give the same lap on every computer.</text>
