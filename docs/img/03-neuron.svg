<svg xmlns="http://www.w3.org/2000/svg" width="870" height="320" viewBox="0 0 870 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>One neuron with real numbers</title>
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="870" height="320"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/></marker></defs>
<rect x="0.5" y="0.5" width="869" height="319" rx="16" fill="#0b0d13" stroke="#00f0ff" stroke-opacity="0.25"/>
<text x="20" y="30" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="bold">one neuron, really: hidden neuron h6, seed 3 gen 40 champion, step 368</text>
<text x="20" y="56" font-size="11" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">input</text>
<text x="230" y="56" font-size="11" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">×  weight</text>
<text x="350" y="56" font-size="11" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">=</text>
<text x="20" y="82" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">left 60°</text>
<text x="160" y="82" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">0.883</text>
<text x="230" y="82" font-size="13" fill="#ff2e63" fill-opacity="1" text-anchor="start" font-weight="normal">×  -1.117</text>
<text x="350" y="82" font-size="13" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">=  -0.987</text>
<line x1="450" y1="78" x2="560" y2="175" stroke="#9fb3c8" stroke-width="1" stroke-opacity="0.5"/>
<text x="20" y="112" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">left 30°</text>
<text x="160" y="112" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">0.339</text>
<text x="230" y="112" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">×  0.733</text>
<text x="350" y="112" font-size="13" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">=  0.248</text>
<line x1="450" y1="108" x2="560" y2="175" stroke="#9fb3c8" stroke-width="1" stroke-opacity="0.5"/>
<text x="20" y="142" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">ahead</text>
<text x="160" y="142" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">0.530</text>
<text x="230" y="142" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">×  1.377</text>
<text x="350" y="142" font-size="13" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">=  0.730</text>
<line x1="450" y1="138" x2="560" y2="175" stroke="#9fb3c8" stroke-width="1" stroke-opacity="0.5"/>
<text x="20" y="172" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">right 30°</text>
<text x="160" y="172" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">0.653</text>
<text x="230" y="172" font-size="13" fill="#ff2e63" fill-opacity="1" text-anchor="start" font-weight="normal">×  -0.182</text>
<text x="350" y="172" font-size="13" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">=  -0.119</text>
<line x1="450" y1="168" x2="560" y2="175" stroke="#9fb3c8" stroke-width="1" stroke-opacity="0.5"/>
<text x="20" y="202" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">right 60°</text>
<text x="160" y="202" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">0.729</text>
<text x="230" y="202" font-size="13" fill="#ff2e63" fill-opacity="1" text-anchor="start" font-weight="normal">×  -0.306</text>
<text x="350" y="202" font-size="13" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">=  -0.223</text>
<line x1="450" y1="198" x2="560" y2="175" stroke="#9fb3c8" stroke-width="1" stroke-opacity="0.5"/>
<text x="20" y="232" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">speed</text>
<text x="160" y="232" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">0.768</text>
<text x="230" y="232" font-size="13" fill="#ff2e63" fill-opacity="1" text-anchor="start" font-weight="normal">×  -0.038</text>
<text x="350" y="232" font-size="13" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">=  -0.030</text>
<line x1="450" y1="228" x2="560" y2="175" stroke="#9fb3c8" stroke-width="1" stroke-opacity="0.5"/>
<circle cx="600" cy="175" r="40" fill="#141826" fill-opacity="1" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
<text x="600" y="170" font-size="11" fill="#e6ebf2" fill-opacity="1" text-anchor="middle" font-weight="normal">add up</text>
<text x="600" y="186" font-size="13" fill="#00f0ff" fill-opacity="1" text-anchor="middle" font-weight="bold">-0.380</text>
<text x="600" y="245" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="middle" font-weight="normal">+ bias -1.173</text>
<text x="600" y="265" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="middle" font-weight="normal">= -1.554</text>
<line x1="642" y1="175" x2="700" y2="175" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<rect x="705" y="150" width="70" height="50" rx="8" fill="#141826" fill-opacity="1" stroke="#ffd23f" stroke-width="1" stroke-opacity="1"/>
<text x="740" y="172" font-size="11" fill="#ffd23f" fill-opacity="1" text-anchor="middle" font-weight="normal">squash</text>
<text x="740" y="188" font-size="11" fill="#ffd23f" fill-opacity="1" text-anchor="middle" font-weight="normal">(tanh)</text>
<line x1="775" y1="175" x2="800" y2="175" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<text x="830" y="180" font-size="16" fill="#ff2e63" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">-0.914</text>
<text x="430" y="300" font-size="12" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">Multiply each input by its weight, add them up, add the bias, squash. That is all a neuron does.</text>
</svg>
