<svg xmlns="http://www.w3.org/2000/svg" width="680" height="294" viewBox="0 0 680 294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>A track in a link</title>
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="680" height="294"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="293" rx="16" fill="#0b0d13" stroke="#00f0ff" stroke-opacity="0.25"/>
<text x="20" y="34" font-size="14" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="bold">how one point becomes 4 letters of the link</text>
<text x="30" y="76" font-size="16" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="bold">x = 220</text>
<text x="30" y="104" font-size="13" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">220 = 3 × 64 + 28</text>
<text x="30" y="132" font-size="13" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">letter no. 3 = D   letter no. 28 = c</text>
<text x="30" y="168" font-size="30" fill="#ffd23f" fill-opacity="1" text-anchor="start" font-weight="bold" filter="url(#glow)">Dc</text>
<text x="330" y="76" font-size="16" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="bold">y = 100</text>
<text x="330" y="104" font-size="13" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">100 = 1 × 64 + 36</text>
<text x="330" y="132" font-size="13" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">letter no. 1 = B   letter no. 36 = k</text>
<text x="330" y="168" font-size="30" fill="#ffd23f" fill-opacity="1" text-anchor="start" font-weight="bold" filter="url(#glow)">Bk</text>
<text x="30" y="196" font-size="10" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">the 64 letters, numbered from 0: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_</text>
<text x="30" y="220" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="start" font-weight="normal">the first point (220, 100) → DcBk · the link starts with "1", the version</text>
<text x="30" y="244" font-size="11" fill="#00f0ff" fill-opacity="1" text-anchor="start" font-weight="normal">?t=1DcBkCgCgCgIwDcJsQkJsRgIwRgH-QaG4G4G4FsGgFUFoFsEwG4EYQaEYRgDSRgCgQkBkIwBk</text>
<text x="30" y="266" font-size="12" fill="#9fb3c8" fill-opacity="1" text-anchor="start" font-weight="normal">18 points × 4 letters + 1 = 73 letters for the whole track</text>
</svg>
