<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>From a wall at 23 px to pressing LEFT</title>
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="274"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="273" rx="16" fill="#0b0d13" stroke="#00f0ff" stroke-opacity="0.25"/>
<rect x="20" y="40" width="195" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.7"/><text x="117.5" y="64" font-size="15" fill="#00f0ff" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">1. THE EYE</text><text x="117.5" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">left 60° sees</text><text x="117.5" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">the inner wall at</text><text x="117.5" y="120" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">23 px</text>
<line x1="215" y1="100" x2="233" y2="100" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<rect x="235" y="40" width="195" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.7"/><text x="332.5" y="64" font-size="15" fill="#00f0ff" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">2. THE INPUT</text><text x="332.5" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">close wall →</text><text x="332.5" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">a big number:</text><text x="332.5" y="120" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">0.883</text>
<line x1="430" y1="100" x2="448" y2="100" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<rect x="450" y="40" width="195" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#ff2e63" stroke-width="1" stroke-opacity="0.7"/><text x="547.5" y="64" font-size="15" fill="#ff2e63" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">3. NEURON h6</text><text x="547.5" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">0.883 × -1.117 = -0.987</text><text x="547.5" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">(its biggest term)</text><text x="547.5" y="120" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">total -1.554 → -0.914</text>
<line x1="645" y1="100" x2="663" y2="100" stroke="#9fb3c8" stroke-width="2" stroke-opacity="1" marker-end="url(#arrow)"/>
<rect x="665" y="40" width="195" height="120" rx="10" fill="#141826" fill-opacity="1" stroke="#ffd23f" stroke-width="1" stroke-opacity="0.7"/><text x="762.5" y="64" font-size="15" fill="#ffd23f" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">4. KEY LEFT</text><text x="762.5" y="86" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">h6: -0.914 × -0.615 = 0.562</text><text x="762.5" y="103" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">(its biggest push)</text><text x="762.5" y="120" font-size="11.5" fill="#e6ebf2" fill-opacity="0.85" text-anchor="middle" font-weight="normal">total 0.672 → 0.662</text>
<text x="440" y="200" font-size="16" fill="#ffd23f" fill-opacity="1" text-anchor="middle" font-weight="bold" filter="url(#glow)">0.662 is more than 0.5 → LEFT PRESSED</text>
<text x="440" y="226" font-size="12" fill="#e6ebf2" fill-opacity="1" text-anchor="middle" font-weight="normal">(BRAKE is pressed too: 0.549. GAS 0.486 and RIGHT 0.356 are not.)</text>
<text x="440" y="254" font-size="11" fill="#9fb3c8" fill-opacity="1" text-anchor="middle" font-weight="normal">Seed 3, generation 40 champion, alone on the track, step 368. Every number is what think() computed.</text>
</svg>
